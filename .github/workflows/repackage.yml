name: Rename APK for Android 2.3

on:
  workflow_dispatch:

jobs:
  rename-apk-23:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download ApkRename tool
        run: |
          git clone https://github.com/sjitech/ApkRename.git
          chmod +x ApkRename/*.sh

      - name: Change Package Name
        run: |
          ./ApkRename/apkRename.sh input.apk com.twitter.android.bsky

      - name: Remove Old Signature (META-INF)
        run: |
          zip -d input_renamed.apk "META-INF/*" || true

      - name: Sign APK with v1 (JAR Signing for Android 2.3)
        run: |
          keytool -genkey -v -keystore android23.keystore -storepass android -alias android23 -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore android23.keystore -storepass android -keypass android input_renamed.apk android23

      - name: Zipalign APK
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -f 4 input_renamed.apk Twitter2.0bsky_2.3_renamed.apk

      - name: Upload Renamed APK
        uses: actions/upload-artifact@v4
        with:
          name: renamed-apk-android23
          path: Twitter2.0bsky_2.3_renamed.apk
